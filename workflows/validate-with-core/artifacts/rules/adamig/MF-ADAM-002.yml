Check:
  all:
  - name: SAFFL
    operator: is_not_contained_by
    value:
    - Y
    - N
Core:
  Id: MF-ADAM-002
  Status: Draft
  Version: '1'
Description: The safety population flag SAFFL is populated with Y or N for every subject.
Executability: Fully Executable
Outcome:
  Message: SAFFL is not Y or N.
  Output Variables:
  - SAFFL
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - ALL
  Domains:
    Include:
    - ADSL
Sensitivity: Record
