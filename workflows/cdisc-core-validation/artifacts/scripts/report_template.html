<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1f23;--muted:#62666d;--line:#e3e3df;--accent:#2f5bd3;--err:#c2362b;--err-bg:#fbeceb;--warn:#a86400;--warn-bg:#fdf3e1;--ok:#1f7a4a;--ok-bg:#e7f4ec;--code:#f1f1ee;--hl:#fff3bf;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not(.embedded){--bg:#141518;--panel:#1c1e22;--ink:#e8e9eb;--muted:#9a9fa7;--line:#2e3137;--accent:#7f9cf5;--err:#ff8a80;--err-bg:#3a1d1b;--warn:#f5b85c;--warn-bg:#3a2c14;--ok:#7fd3a3;--ok-bg:#16301f;--code:#23262b;--hl:#4a4320}}
html.dark{--bg:#141518;--panel:#1c1e22;--ink:#e8e9eb;--muted:#9a9fa7;--line:#2e3137;--accent:#7f9cf5;--err:#ff8a80;--err-bg:#3a1d1b;--warn:#f5b85c;--warn-bg:#3a2c14;--ok:#7fd3a3;--ok-bg:#16301f;--code:#23262b;--hl:#4a4320}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px}
.tile.bad b{color:var(--err)}.tile.good b{color:var(--ok)}.tile.warn b{color:var(--warn)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 14px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;font:inherit;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
input{flex:1;min-width:180px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.head{display:grid;grid-template-columns:18px 120px 70px 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.head:hover{background:var(--code)}
.caret{color:var(--muted);transition:transform .15s}.open .caret{transform:rotate(90deg)}
.rid{font-family:var(--mono);font-size:12.5px}
.ds{font-weight:600}
.msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nums{display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill{border-radius:999px;padding:1px 8px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.pill.error{background:var(--err-bg);color:var(--err);border-color:transparent}
.pill.warning{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.new{background:var(--err-bg);color:var(--err);border-color:transparent}
.pill.fixed{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.body{display:none;border-top:1px solid var(--line);padding:12px 14px}
.open .body{display:block}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-bottom:10px}
h3{font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;background:var(--code)}
td.mono,.mono{font-family:var(--mono)}
.trace{border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.chain .node{background:var(--code);border-radius:6px;padding:2px 8px;font-family:var(--mono)}
.chain .arrow{color:var(--muted)}
pre{background:var(--code);border-radius:6px;padding:8px 0;margin:8px 0 0;overflow-x:auto;font:12px/1.5 var(--mono)}
pre div{padding:0 10px;white-space:pre}
pre div.hl{background:var(--hl)}
pre span.ln{display:inline-block;width:3.5em;color:var(--muted);user-select:none}
.empty{color:var(--muted);padding:20px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:10px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:13px}
.hidden{display:none}
@media (max-width:720px){.head{grid-template-columns:18px 1fr auto}.head .ds,.head .msg{grid-column:2/4}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <div class="tiles" id="tiles"></div>
  <div id="notes"></div>
  <nav id="tabs"></nav>
  <section data-tab="findings">
    <div class="bar">
      <input id="search" placeholder="Filter by rule, dataset, variable, subject or message" aria-label="Filter findings">
      <select id="dataset" aria-label="Dataset"><option value="">All datasets</option></select>
      <select id="severity" aria-label="Severity"><option value="">All severities</option><option>error</option><option>warning</option><option>ignore</option></select>
    </div>
    <div id="groups"></div>
  </section>
  <section data-tab="unchecked" class="hidden"><div id="unchecked"></div></section>
  <section data-tab="datasets" class="hidden"><div id="datasets"></div></section>
</main>
<script>
if (window.parent !== window) document.documentElement.classList.add('embedded');
const DATA = __DATA__;
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const c = DATA.counts, cfg = DATA.config, conf = DATA.conformance || {};
document.getElementById('title').textContent = `CDISC CORE — ${String(cfg.standard || '').toUpperCase()} ${String(cfg.version || '').replace(/-/g, '.')}`;
document.getElementById('subtitle').textContent = [
  `CORE ${DATA.coreVersion || conf.CORE_Engine_Version || ''}`,
  `CT ${conf.CT_Version || cfg.ct || 'not supplied'}`,
  `Define-XML ${conf.Define_XML_Version || 'not supplied'}`,
  DATA.lineage ? 'lineage: traced to code' : 'lineage: not supplied',
  conf.Report_Generation ? `generated ${conf.Report_Generation}` : '',
].filter(Boolean).join(' · ');

const tile = (value, label, tone) => `<div class="tile ${tone || ''}"><b>${esc(value)}</b><span>${esc(label)}</span></div>`;
document.getElementById('tiles').innerHTML = [
  tile(c.issues, 'issues', c.issues ? 'bad' : 'good'),
  tile(c.errorGroups, 'error-level findings', c.errorGroups ? 'bad' : 'good'),
  tile(c.groups, 'rule × dataset findings'),
  c.new === null ? '' : tile(c.new, 'new since last validation', c.new ? 'bad' : 'good'),
  c.fixed === null ? '' : tile(c.fixed, 'fixed since last validation', c.fixed ? 'good' : ''),
  tile(c.notChecked, 'rules not checked', c.notChecked ? 'warn' : 'good'),
  tile(c.datasets, 'datasets validated'),
].join('');
document.getElementById('notes').innerHTML = [
  ...(DATA.notes || []).map((note) => `<div class="note">${esc(note)}</div>`),
  ...(DATA.intake || []).map((item) => `<div class="note">${esc(item.dataset)}: ${esc(item.problem)}</div>`),
].join('');

const tabs = [['findings', `Findings (${c.groups})`], ['unchecked', `Not checked (${c.notChecked})`], ['datasets', `Datasets (${c.datasets})`]];
const nav = document.getElementById('tabs');
nav.innerHTML = tabs.map(([id, label], index) => `<button data-id="${id}" class="${index === 0 ? 'on' : ''}">${esc(label)}</button>`).join('');
nav.addEventListener('click', (event) => {
  const id = event.target.dataset.id; if (!id) return;
  nav.querySelectorAll('button').forEach((button) => button.classList.toggle('on', button.dataset.id === id));
  document.querySelectorAll('section[data-tab]').forEach((section) => section.classList.toggle('hidden', section.dataset.tab !== id));
});

const datasetSelect = document.getElementById('dataset');
[...new Set(DATA.groups.map((group) => group.dataset))].sort().forEach((name) => datasetSelect.insertAdjacentHTML('beforeend', `<option>${esc(name)}</option>`));

function snippet(trace) {
  if (!trace.snippet) return '';
  const [from, to] = trace.snippet.highlight;
  return '<pre>' + trace.snippet.code.map((line, index) => {
    const number = trace.snippet.first + index;
    return `<div class="${number >= from && number <= to ? 'hl' : ''}"><span class="ln">${number}</span>${esc(line)}</div>`;
  }).join('') + '</pre>';
}
const used = (list) => list && list.length ? `<span class="arrow">→</span>${list.map((id) => `<span class="node">${esc(id)}</span>`).join('')}` : '';
function traceHtml(group) {
  if (!group.trace) return DATA.lineage ? '' : '<h3>Trace</h3><div class="sub">No lineage.json was supplied, so findings are traced to records only.</div>';
  const { derivations, impacts } = group.trace;
  if (!derivations.length && !impacts.length) return '<h3>Trace</h3><div class="sub">None of these variables appear in the lineage.</div>';
  const derived = derivations.map((item) => `<div class="trace"><div class="chain">
      ${(item.sources || []).map((source) => `<span class="node">${esc(source)}</span>`).join('')}${item.sources && item.sources.length ? '<span class="arrow">→</span>' : ''}
      <span class="node">${esc(item.program)}:${esc((item.lines || []).join('-'))}</span><span class="arrow">→</span>
      <span class="node">${esc(item.variable)}</span>${used(item.usedBy)}</div>
      <div class="meta"><span>origin: ${esc(item.origin || '')}</span><span>spec: ${esc(item.spec || '')}</span>${item.method ? `<span>method: ${esc(item.method)}</span>` : ''}</div>
      ${snippet(item)}</div>`).join('');
  const impacted = impacts.length ? `<h3>Downstream impact</h3><div class="scroll"><table><tr><th>Source</th><th>Derived variable</th><th>Program</th><th>Used by</th></tr>${impacts.map((item) => `<tr><td class="mono">${esc(item.source)}</td><td class="mono">${esc(item.derived)}</td><td class="mono">${esc(item.program || '')}:${esc((item.lines || []).join('-'))}</td><td>${esc((item.usedBy || []).join(', '))}</td></tr>`).join('')}</table></div>` : '';
  return (derived ? '<h3>Traced to code</h3>' + derived : '') + impacted;
}
function examplesHtml(group) {
  const hasSource = group.examples.some((example) => example.source);
  const rows = group.examples.map((example) => `<tr><td class="mono">${esc(example.USUBJID)}</td><td>${esc(example.row)}</td><td>${esc(example.SEQ)}</td>
    <td class="mono">${example.variables.map((name, index) => `${esc(name)}=${esc(example.values[index])}`).join('<br>')}</td>
    ${hasSource ? `<td class="mono">${example.source ? esc(`${example.source.SRCDOM || ''}.${example.source.SRCVAR || ''} seq ${example.source.SRCSEQ || ''}`) : ''}</td>` : ''}</tr>`).join('');
  const more = group.issues > group.examples.length ? `<div class="sub">Showing ${group.examples.length} of ${group.issues}; all records are in core-report.xlsx / core-report.json.</div>` : '';
  return `<h3>Records</h3><div class="scroll"><table><tr><th>USUBJID</th><th>Row</th><th>SEQ</th><th>Values</th>${hasSource ? '<th>Source record</th>' : ''}</tr>${rows}</table></div>${more}`;
}
function card(group) {
  const change = group.new === null ? '' : `${group.new ? `<span class="pill new">+${group.new}</span>` : ''}${group.fixed ? `<span class="pill fixed">−${group.fixed}</span>` : ''}`;
  const previous = group.previous ? `<span>previously: ${esc(group.previous.disposition)}${group.previous.justification ? ` — ${esc(group.previous.justification)}` : ''}</span>` : '';
  return `<div class="card" data-id="${esc(group.id)}"><div class="head"><span class="caret">▸</span><span class="rid">${esc(group.coreId)}</span><span class="ds">${esc(group.dataset)}</span>
    <span class="msg" title="${esc(group.message)}">${esc(group.message)}</span>
    <span class="nums"><span class="pill ${esc(group.severity)}">${esc(group.severity)}</span><span class="pill">${group.issues} issue${group.issues === 1 ? '' : 's'}</span>${group.subjects ? `<span class="pill">${group.subjects} subj</span>` : ''}${change}</span></div>
    <div class="body"><div>${esc(group.message)}</div><div class="meta">
      ${group.cdiscRuleId ? `<span>CDISC ${esc(group.cdiscRuleId)}</span>` : ''}${group.fdaRuleId ? `<span>FDA ${esc(group.fdaRuleId)}</span>` : ''}
      <span>${esc(group.ruleSource)} rule</span><span>${esc(group.executability)}</span><span>variables: ${esc(group.variables.join(', '))}</span>${previous}</div>
      ${traceHtml(group)}${examplesHtml(group)}</div></div>`;
}
const haystack = (group) => [group.coreId, group.dataset, group.message, group.variables.join(' '), ...group.examples.map((example) => example.USUBJID)].join(' ').toLowerCase();
function draw() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const dataset = datasetSelect.value, severity = document.getElementById('severity').value;
  const shown = DATA.groups.filter((group) => (!dataset || group.dataset === dataset) && (!severity || group.severity === severity) && (!query || haystack(group).includes(query)));
  document.getElementById('groups').innerHTML = shown.length ? shown.map(card).join('') : `<div class="empty">${DATA.groups.length ? 'No finding matches the filter.' : 'CORE reported no issues.'}</div>`;
}
document.getElementById('groups').addEventListener('click', (event) => { const head = event.target.closest('.head'); if (head) head.parentElement.classList.toggle('open'); });
['search', 'dataset', 'severity'].forEach((id) => document.getElementById(id).addEventListener('input', draw));
draw();

document.getElementById('unchecked').innerHTML = DATA.notChecked.length
  ? `<p class="sub">These rules did not produce a result. They are not passes: an execution error means CORE could not run the rule; a skip names the input it needed (define.xml, controlled terminology, a dictionary).</p><div class="scroll"><table><tr><th>Rule</th><th>Status</th><th>Reason</th><th>Rule message</th></tr>${DATA.notChecked.map((row) => `<tr><td class="mono">${esc(row.coreId)}</td><td>${esc(row.status)}</td><td>${esc(row.reason)}</td><td>${esc(row.message)}</td></tr>`).join('')}</table></div>`
  : '<div class="empty">Every applicable rule executed.</div>';
const statusLine = Object.entries(DATA.statusCounts || {}).map(([status, count]) => `${status}: ${count}`).join(' · ');
document.getElementById('datasets').innerHTML = `<p class="sub">Rule results — ${esc(statusLine)}</p><div class="scroll"><table><tr><th>Dataset</th><th>Uploaded as</th><th>Records</th><th>Variables</th></tr>${DATA.datasets.map((row) => `<tr><td class="mono">${esc(String(row.name).toUpperCase())}</td><td>${esc(row.source)}</td><td>${esc(row.records)}</td><td>${esc(row.variables)}</td></tr>`).join('')}</table></div>`;
</script>
</body>
</html>
