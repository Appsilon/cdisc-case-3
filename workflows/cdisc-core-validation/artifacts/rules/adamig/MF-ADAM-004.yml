Check:
  all:
  - name: SAFFL
    operator: equal_to
    value: Y
  - name: TRTSDT
    operator: empty
Core:
  Id: MF-ADAM-004
  Status: Draft
  Version: '1'
Description: Every subject in the safety population has a first treatment date.
Executability: Fully Executable
Outcome:
  Message: SAFFL = 'Y' but TRTSDT is missing.
  Output Variables:
  - SAFFL
  - TRTSDT
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - ALL
  Domains:
    Include:
    - ADSL
Sensitivity: Record
